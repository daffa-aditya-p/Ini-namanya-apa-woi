name: CI & Visual Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm 9.15.9
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run Vitest (Unit, Schemas, Runners, J1 & P1 Real Execution)
        run: pnpm test

      - name: Build Astro Static Site
        run: pnpm build

  visual-breakpoints:
    name: Playwright 3-Breakpoint Screenshots & Axe-Core Audit
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm 9.15.9
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build Astro Static Site
        run: pnpm build

      - name: Run Playwright Visual Breakpoint Tests (375px, 768px, 1440px)
        run: npx playwright test tests/visual.spec.ts

      - name: Copy Breakpoints for Review
        if: always()
        run: |
          mkdir -p docs/design-review
          [ -f screenshots/mobile-375x667/home.png ] && cp screenshots/mobile-375x667/home.png docs/design-review/mobile-375x667.png || true
          [ -f screenshots/tablet-768x1024/home.png ] && cp screenshots/tablet-768x1024/home.png docs/design-review/tablet-768x1024.png || true
          [ -f screenshots/desktop-1440x900/home.png ] && cp screenshots/desktop-1440x900/home.png docs/design-review/desktop-1440x900.png || true

      - name: Upload 3-Breakpoint Screenshots Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: breakpoint-screenshots
          path: screenshots/
          retention-days: 14
